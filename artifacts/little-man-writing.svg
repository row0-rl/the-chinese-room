    <path d="M149 215 C130 211 111 231 110 246 Q109 255 121 258 L170 272"/>
    <path d="M228 215 Q247 210 257 224 Q266 237 254 245 L200 275"/>
    <path d="M170 272 q8 -2 13 2 M200 275 q-6 -6 -11 -2 l-3 5"/>
