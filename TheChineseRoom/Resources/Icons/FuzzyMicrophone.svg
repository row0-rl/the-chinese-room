<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" color="#25231f" role="img" aria-labelledby="title desc">
  <title id="title">Fuzzy cartoon microphone</title>
  <desc id="desc">A softly rounded, hand-drawn microphone with a softly textured charcoal outline on a transparent background.</desc>
  <defs>
    <filter id="fuzz" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.19" numOctaves="3" seed="17" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="1.7" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
  </defs>

  <!-- Rounded silhouettes and small irregularities keep the icon legible at small sizes. -->
  <g stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#fuzz)">
    <path d="M36 56 C34 76 43 90 63 91 C84 92 95 78 93 56"/>
    <path d="M64 92 C63 99 64 103 64 109"/>
    <path d="M46 112 C51 108 76 108 82 112 C76 115 52 115 46 112Z" fill="currentColor"/>
    <g transform="rotate(-4 64 48)">
      <path d="M46 33 C45 21 53 15 64 15 C76 14 83 23 83 34 L82 62 C83 74 75 81 64 81 C52 82 45 74 46 62Z" fill="#f7f0df"/>
      <g stroke-width="3.2">
        <path d="M56 30 C61 29 68 29 73 30"/>
        <path d="M54 40 C61 41 69 40 75 40"/>
        <path d="M54 51 C61 50 69 51 74 50"/>
        <path d="M56 61 C61 62 67 62 72 61"/>
      </g>
    </g>
  </g>

</svg>
